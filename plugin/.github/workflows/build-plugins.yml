name: Build LiquidSpectra VST3 & AU (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows VST3 & Standalone (x64 MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release x64)
        run: cmake -B build -A x64

      - name: Build VST3, Standalone and tests
        run: cmake --build build --config Release --parallel

      - name: Run DSP Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: LiquidSpectra-Windows-x64
          path: |
            build/LiquidSpectra_artefacts/Release/VST3/
            build/LiquidSpectra_artefacts/Release/Standalone/
          retention-days: 14

  build-macos:
    name: macOS VST3 & AU (Universal arm64 + x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (Universal)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build VST3, AU, Standalone and tests
        run: cmake --build build --config Release --parallel

      - name: Run DSP Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload macOS Bundles
        uses: actions/upload-artifact@v4
        with:
          name: LiquidSpectra-macOS-Universal
          path: |
            build/LiquidSpectra_artefacts/Release/VST3/
            build/LiquidSpectra_artefacts/Release/AU/
            build/LiquidSpectra_artefacts/Release/Standalone/
          retention-days: 14
